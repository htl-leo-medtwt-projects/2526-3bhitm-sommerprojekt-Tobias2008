<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event</title>
    <link rel="stylesheet" href="../style/global.css">
    <link rel="stylesheet" href="../style/create-event.css">
    <script src="../script/create-event.js" defer></script>
</head>

<body>

    <h1 id="headline">Create your Event</h1>
    <p id="titletext">Here you can create your own Event!<br> You can add as many friends as you want, set the location
        you want, and even calculate the average costs. Have fun!</p>

    <form action="../php/event.php?action=create" method="POST" id="create-event-form" enctype="multipart/form-data">
        <input type="text" placeholder="* Event Name..." name="event-name" id="event-name" required>
        <input type="text" placeholder="* Title Text..." name="title-text" id="title-text" required>
        <textarea placeholder="Information..." name="event-information" id="event-information"></textarea>
        <input type="date" name="event-date" id="event-date">
        <input type="text" placeholder="Location..." name="event-location" id="event-location">

        <div id="member-box">
            <div id="max-member-box"><label for="max-members">Max Members</label>
                <input type="number" name="max-members" id="max-members" min="1" placeholder="1-99">
            </div>

            <div id="add-member-box">
                <label for="add-member">Add Member</label>
                <div id="add-members-box">
                    <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true"
                        xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 2 21 20">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 12h4m-2 2v-4M4 18v-1a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v1a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Zm8-10a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    </svg>

                </div>
            </div>
        </div>

        <div id="input-field-image">
            <svg class="w-6 h-6 text-gray-800 dark:text-white image-icon" aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg" width="150" height="150" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="0.5"
                    d="m3 16 5-7 6 6.5m6.5 2.5L16 13l-4.286 6M14 10h.01M4 19h16a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Z" />
            </svg>

            <input type="file" name="event-image" id="fileInput" accept="image/*" hidden>
        </div>

        <div id="buttons">
            <button type="button" onclick="window.location.href='event.html'">
                Cancel
            </button>
            <button type="submit">Create</button>
        </div>
    </form>

    <footer class="speacialfooter">
        <p>&copy; 2026 Payreder Management. All rights reserved.</p>
    </footer>

</body>

</html>
