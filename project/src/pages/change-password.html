<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="../style/change-password.css">
    <script src="../script/change-password.js" defer></script>



</head>

<body>

    <h1 id="headline">Change Password</h1>

    <section class="settings-card">

        <input type="password" id="oldPassword" placeholder="Current Password">
