    <h1 id="headline">View of the Event</h1>
    <p id="textHeadline">Here you can view or Edit an Event!</p>


    <div id="view-event">
        <div id="event-image"></div>


        <div id="event-header">

            <div id="event-title-wrapper">
                <h1 id="event-title"></h1>

                <div id="favorite-star">
                    <svg viewBox="0 0 24 24" width="22" height="22">
                        <path d="M12 2 L15 9 L22 9 L17 14 L19 22 L12 18 L5 22 L7 14 L2 9 L9 9 Z" stroke-width="2"
                            stroke-linejoin="round" stroke-linecap="round" />
                    </svg>
                </div>
            </div>

            <p id="title-text"></p>
            <p id="information"></p>

        </div>
        <div id="viewMemberButton" onclick="displayMembers()">
            <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                width="24" height="24" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-width="2"
                    d="M4.5 17H4a1 1 0 0 1-1-1 3 3 0 0 1 3-3h1m0-3.05A2.5 2.5 0 1 1 9 5.5M19.5 17h.5a1 1 0 0 0 1-1 3 3 0 0 0-3-3h-1m0-3.05a2.5 2.5 0 1 0-2-4.45m.5 13.5h-7a1 1 0 0 1-1-1 3 3 0 0 1 3-3h3a3 3 0 0 1 3 3 1 1 0 0 1-1 1Zm-1-9.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Z" />
            </svg>

            View Members
        </div>

        <div id="items">
        </div>
    </div>

    <div id="item-details"></div>

    <div id="member-popup-overlay">

        <div id="member-popup">

            <div id="popup-close">✕</div>

            <h2>Members</h2>



            <div id="friends-dropdown-wrapper">
                <div id="add-member-button">
                    + Add Member
                </div>


                <div id="friends-dropdown">
                </div>

            </div>

            <div id="member-list"></div>

        </div>

    </div>
    <div id="custom-popup" class="popup-overlay">

        <div class="popup-box">

            <h3 id="popup-title">Create</h3>

            <input type="text" id="popup-input" placeholder="Name">

            <div class="popup-buttons">

                <button id="popup-cancel">
                    Cancel
                </button>

                <button id="popup-ok">
                    OK
                </button>

            </div>

        </div>

    </div>

    <div id="confirm-popup" class="popup-overlay">

        <div class="popup-box">

            <h3 id="confirm-title">Confirmation</h3>
            <p id="confirm-text"></p>

            <div class="popup-buttons">

                <button id="confirm-cancel">
                    Cancel
                </button>

                <button id="confirm-ok">
                    Remove
                </button>

            </div>

        </div>

    </div>

    <div id="danger-zone" class="danger-card" style="display: none;">
        <h3 class="danger-title">
            Danger Zone
        </h3>

        <p class="danger-text">
            Deleting this event will permanently remove
            all members, categories and items.
        </p>

        <button id="delete-event">
            Delete Event
        </button>
    </div>
    <div id="member-limit-popup" class="popup-overlay">

    <div class="popup-box">

        <h3>Member Limit Reached</h3>

        <p id="member-limit-text"></p>

        <div class="popup-buttons">

            <button id="member-limit-cancel">
                Cancel
            </button>

            <button id="member-limit-add">
                Add
            </button>

        </div>

    </div>

</div>
